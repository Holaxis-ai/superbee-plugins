name: CI
on:
  pull_request:
    # edited covers a retargeted base, which changes what the index must be compared against.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Holaxis-ai/superbee
          ref: 50ebd89a3598d273e8966e72c66db36ab1fe9782
          path: .package-verification-producer
          persist-credentials: false
      - name: Check package verification snapshot against public producer Git objects
        run: node .package-verification-producer/packages/package-verification/export.mjs --source .package-verification-producer --target scripts/vendor/package-verification --check
      - run: npm ci
      # Core publishes the host helper contract first. An unavailable prerelease must fail here.
      - run: npm install --no-save --package-lock=false --ignore-scripts @superbee/core@0.2.0-pre.46
      - name: Provision native synthetic media test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg python3-venv poppler-utils
          python3 -m venv --copies "$RUNNER_TEMP/blender-media-python"
          "$RUNNER_TEMP/blender-media-python/bin/python" -I -m pip install Pillow==11.3.0
          echo "SUPERBEE_TEST_PYTHON=$RUNNER_TEMP/blender-media-python/bin/python" >> "$GITHUB_ENV"
      - name: Record native media test runtimes
        run: |
          ffmpeg -version
          ffprobe -version
          "$SUPERBEE_TEST_PYTHON" -I -c 'import sys, PIL; print(sys.version); print("Pillow", PIL.__version__)'
      - run: npm run build
      - run: npm run typecheck
      - name: Check recipe index against the recipes
        run: node scripts/build-recipe-index.mjs --check
      - name: Check recipe index immutability against the base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            node scripts/build-recipe-index.mjs --compare "$BASE_SHA"
          else
            git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
            node scripts/build-recipe-index.mjs --compare origin/main
          fi
      - run: npm run test:unit
      - run: npm run test:packaged
  experimental-mcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - name: Build the app against the published workspace library
        working-directory: apps/mcp
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm pack --offline "$(node -p "require('./package-lock.json').packages['node_modules/@superbee/cli'].resolved")" --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - name: Compare packaged tools with the published Superbee CLI
        working-directory: apps/mcp
        run: node test/catalog-parity.mjs "$RUNNER_TEMP"/superbee-cli-*.tgz "$PWD/node_modules/superbee/dist/superbee.mjs"
      - name: Assemble the offline preview for this run
        working-directory: apps/mcp
        run: |
          pair="$RUNNER_TEMP/superbee-mcp-offline-preview"
          mkdir "$pair"
          cp "$RUNNER_TEMP"/superbee-cli-*.tgz "$pair/"
          npm pack --ignore-scripts --pack-destination "$pair"
          cp README.md "$pair/"
          printf '@superbee/cli %s\nsuperbee-plugins %s\n' \
            "$(node -p "require('./package.json').peerDependencies['@superbee/cli']")" "$(git rev-parse HEAD)" > "$pair/SOURCES"
          cd "$pair"
          sha256sum *.tgz README.md SOURCES > SHA256SUMS
      - name: Exercise the downloadable pair and its browser screens
        working-directory: apps/mcp
        run: |
          npx --no-install playwright install --with-deps chromium
          pair="$RUNNER_TEMP/superbee-mcp-offline-preview"
          node test/acceptance.mjs "$pair"/superbee-cli-*.tgz --plugin "$pair"/superbee-experimental-mcp-*.tgz --browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: superbee-mcp-offline-preview
          path: ${{ runner.temp }}/superbee-mcp-offline-preview/
          if-no-files-found: error
      - name: Pack the standalone Claude Desktop extension
        working-directory: apps/mcp
        run: |
          node desktop/pack.mjs
          node test/desktop.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: superbee-desktop-preview
          path: apps/mcp/out/superbee-experimental.mcpb
          if-no-files-found: error
  desktop-bundle-macos:
    needs: experimental-mcp
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: superbee-desktop-preview
          path: apps/mcp/out
      - name: Open a document from the extracted extension on macOS
        working-directory: apps/mcp
        run: |
          npm ci --ignore-scripts
          node test/desktop.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: superbee-mcp-offline-preview
          path: ${{ runner.temp }}/superbee-mcp-offline-preview
      - name: Install the downloaded pair offline on macOS
        working-directory: ${{ runner.temp }}/superbee-mcp-offline-preview
        run: |
          shasum -a 256 -c SHA256SUMS
          prefix="$RUNNER_TEMP/installed-preview"
          npm install --prefix "$prefix" --offline --cache "$RUNNER_TEMP/empty-preview-cache" --ignore-scripts --no-audit --no-fund \
            "$PWD"/superbee-cli-*.tgz "$PWD"/superbee-experimental-mcp-*.tgz
          "$prefix/node_modules/.bin/superbee-mcp" --help
  windows-codex:
    needs: experimental-mcp
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: superbee-mcp-offline-preview
          path: ${{ runner.temp }}/offline-pair
      - name: Install the pinned native Codex host
        run: |
          $tools = Join-Path $env:RUNNER_TEMP 'Codex tools'
          npm install --prefix $tools --no-package-lock --ignore-scripts --no-audit --no-fund '@openai/codex-windows@npm:@openai/codex@0.149.0-win32-x64'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Join-Path $tools 'node_modules/@openai/codex-windows/vendor/x86_64-pc-windows-msvc/bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install the download offline and open a document and a View in Codex
        run: |
          $pair = Join-Path $env:RUNNER_TEMP 'offline-pair'
          foreach ($line in Get-Content (Join-Path $pair 'SHA256SUMS')) {
            $hash, $file = $line -split '  ', 2
            if ((Get-FileHash -Algorithm SHA256 (Join-Path $pair $file)).Hash -ne $hash) {
              throw "Offline download checksum differs for $file"
            }
          }
          $prefix = Join-Path $env:RUNNER_TEMP 'Offline install'
          $archives = (Get-ChildItem $pair -Filter '*.tgz').FullName
          npm install --prefix $prefix --offline --cache (Join-Path $env:RUNNER_TEMP 'empty-preview-cache') --ignore-scripts --no-audit --no-fund @archives
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $prefix 'node_modules/.bin/superbee-mcp.cmd') --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/mcp/test/codex-host.mjs $prefix
