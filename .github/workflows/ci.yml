name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.8.2
          cache: npm
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Holaxis-ai/superbee
          ref: 50ebd89a3598d273e8966e72c66db36ab1fe9782
          path: .package-verification-producer
          persist-credentials: false
      - name: Check package verification snapshot against public producer Git objects
        run: node .package-verification-producer/packages/package-verification/export.mjs --source .package-verification-producer --target scripts/vendor/package-verification --check
      - run: npm ci
      # Core publishes the host helper contract first. An unavailable prerelease must fail here.
      - run: npm install --no-save --package-lock=false --ignore-scripts @superbee/core@0.2.0-pre.25
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:packaged
